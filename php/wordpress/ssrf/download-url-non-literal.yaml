rules:
  # ============================================================================
  # download_url() with a non-literal URL — POTENTIAL SSRF (no host allowlist)
  # Generic CodeVigilant rule.
  # ============================================================================
  #
  # Flags download_url() calls whose URL argument is a variable/expression
  # rather than a hard-coded string literal and is not passed through
  # wp_http_validate_url() first. download_url() (wp-admin/includes/file.php)
  # performs an unauthenticated server-side GET via wp_remote_get() — NOT
  # wp_safe_remote_get() — and follows redirects, so any http/https URL
  # (including RFC1918/loopback addresses and cloud-metadata IPs such as
  # 169.254.169.254) is fetched from the web server. The URL may originate
  # from third-party data (page content, imported records, remote APIs,
  # plugin settings) that the caller does not fully control, so an attacker
  # who can influence such a value can make the web server fetch internal
  # hosts. esc_url()/esc_url_raw()/sanitize_url() do NOT mitigate this: they
  # only restrict the scheme and strip hostile characters but keep private
  # IPs and local hostnames intact. Validate the resolved host against an
  # explicit allowlist (wp_http_validate_url() is a scheme/format check, not
  # a host allowlist) before calling download_url().

  - id: codevigilant.php.wordpress.ssrf.any.download_url.non_literal_url
    severity: HIGH
    languages: [php]
    mode: search
    patterns:
      - pattern-either:
          - pattern: download_url($URL)
          - pattern: download_url($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          # Exclude hard-coded string literals (single or double quoted)
          regex: ^(?!['"])
      - pattern-not: download_url(wp_http_validate_url(...), ...)
      - pattern-not: download_url(wp_http_validate_url(...))
    message: |
      Detected a potential Server-Side Request Forgery (SSRF) vector: a
      non-literal URL is passed to download_url() without
      wp_http_validate_url() or an explicit host allowlist. download_url()
      issues a server-side wp_remote_get() (not the safe variant) and follows
      redirects, so a value influenced by third-party or request data can
      make the server fetch internal hosts (e.g. 127.0.0.1, RFC1918 ranges,
      cloud metadata 169.254.169.254). esc_url()/esc_url_raw()/sanitize_url()
      are NOT sufficient — they keep private IPs. Validate the resolved host
      against an explicit allowlist before calling download_url().
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://developer.wordpress.org/reference/functions/download_url/
        - https://developer.wordpress.org/reference/functions/wp_remote_get/
        - https://developer.wordpress.org/apis/security/data-validation/
      source: CodeVigilant
      license: MIT
