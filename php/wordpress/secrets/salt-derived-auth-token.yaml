rules:
  # ============================================================================
  # AUTHENTICATION TOKEN DERIVED FROM WORDPRESS SALT CONSTANTS
  # Generic CodeVigilant rule.
  # ============================================================================
  #
  # Flags request-authentication secrets built from the WordPress salt
  # constants (AUTH_SALT / NONCE_SALT / NONCE_KEY / SECURE_AUTH_SALT / ...),
  # typically as md5(substr(NONCE_SALT, 0, N) . substr(NONCE_KEY, 0, M)).
  #
  # Such a value is a static, shared credential: it never rotates, it is
  # identical for every user and request, and it is derived from material
  # (the salts) that also protects other application state. Comparing a
  # request parameter against it (often with a plain == against an md5()
  # string) is not a substitute for a per-request nonce: whoever learns the
  # value once (logs, a leaked config, a third party the value is
  # transmitted to, a backup) can reuse it forever to authenticate as any
  # user (CWE-798/CWE-321). Use wp_create_nonce()/wp_verify_nonce() or a
  # proper per-request, rotating challenge instead.
  #
  # CWE-798: Use of Hard-coded Credentials

  - id: codevigilant.php.wordpress.secrets.salt_derived_auth_token
    severity: WARNING
    languages: [php]
    mode: search
    patterns:
      - pattern-either:
          - pattern: md5(substr(NONCE_SALT, ...) . substr(NONCE_KEY, ...))
          - pattern: md5(substr(NONCE_KEY, ...) . substr(NONCE_SALT, ...))
          - pattern: md5(substr(NONCE_SALT, ...) . substr(AUTH_SALT, ...))
          - pattern: md5(substr(NONCE_SALT, ...) . substr(SECURE_AUTH_SALT, ...))
          - pattern: md5(substr(NONCE_KEY, ...) . substr(AUTH_KEY, ...))
          - pattern: md5(substr(NONCE_KEY, ...) . substr(SECURE_AUTH_KEY, ...))
          - pattern: hash('md5', substr(NONCE_SALT, ...) . substr(NONCE_KEY, ...))
          - pattern: hash('md5', substr(NONCE_KEY, ...) . substr(NONCE_SALT, ...))
    message: |
      A request-authentication secret is derived from the WordPress salt
      constants (e.g. md5(substr(NONCE_SALT, ...) . substr(NONCE_KEY, ...))).
      This produces a static, non-rotating credential shared by every
      request: anyone who obtains the value once can reuse it indefinitely
      to authenticate (CWE-798), and transmitting it to third parties
      permanently exposes the access path. Replace it with
      wp_create_nonce()/wp_verify_nonce() or another per-request, rotating
      challenge that is never derived from long-lived site secrets.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      technology: wordpress
      confidence: MEDIUM
      references:
        - https://developer.wordpress.org/reference/functions/wp_create_nonce/
        - https://developer.wordpress.org/reference/functions/wp_verify_nonce/
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
      source: CodeVigilant
      license: MIT
