rules:
  # ============================================================================
  # HTTP REQUEST URL TAKEN FROM A PARSED-DOCUMENT FIELD (CWE-918 SSRF,
  # CWE-522 Insufficiently Protected Credentials)
  # Generic shape: a request/URL object is built from a *field of a model object*
  # (`new HttpUrl($MODEL.$FIELD)` / `new URL($MODEL.$FIELD)`) - i.e. a value that
  # came out of a parsed JSON/XML/response document - instead of from validated
  # configuration. In Jenkins-style plugins the URL is then executed by the same
  # HTTP client that holds the server credential, so the credential is attached
  # to whatever host the document names: the request follows the value, and the
  # token follows the request.
  # ============================================================================

  - id: codevigilant.java.jenkins.ssrf.model-field-request-url
    message: >-
      A request URL is constructed from a field of a parsed model object
      (`new HttpUrl($M.$F)`), not from validated configuration. Values that come
      from a document generated by a scan/build or read back from a workspace can
      be chosen by whoever influenced that document, so the follow-up request - and
      any credential the HTTP client attaches - goes to a host of their choosing
      (CWE-918/CWE-522). Validate the parsed URL against the configured server
      origin (scheme, host, port) before requesting it, refuse redirects/absolute
      URLs to other origins, and never attach the server credential to a request
      whose URL did not originate from configuration.
    severity: WARNING
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: new HttpUrl($M.$F)
          - pattern: new URL($M.$F)
          - pattern: URI.create($M.$F)
      - pattern-not: new HttpUrl("...")
      - pattern-not: new URL("...")
      - pattern-not-inside: |
          class $C {
            ...
            $T $F;
            ...
          }
      - pattern-not-inside: |
          $T $M(...) {
            ...
            if (!$M.$F.startsWith(...)) { ... }
            ...
          }
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      technology: jenkins
      confidence: LOW
      references:
        - https://cwe.mitre.org/data/definitions/918.html
        - https://cwe.mitre.org/data/definitions/522.html
      source: semgrep-rule-gap
      license: MIT
