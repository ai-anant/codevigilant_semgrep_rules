rules:
  # ============================================================================
  # OUTBOUND HTTP REQUEST TO NON-LITERAL URL WITH CREDENTIALS ATTACHED
  # (CWE-918 Server-Side Request Forgery / CWE-522 Credential Disclosure)
  # Generic shape: an Apache HttpClient (HttpClients.custom()) attaches a
  # UsernamePasswordCredentials via BasicCredentialsProvider to an outbound
  # HttpGet/HttpPost whose URL is derived from a non-literal/config-driven
  # value. If the URL is attacker/influenceable, the request can be redirected
  # to an arbitrary host which then receives the embedded credentials.
  # ============================================================================

  - id: codevigilant.java.jenkins.ssrf.httpclient-nonliteral-url-with-creds
    message: >-
      An outbound Apache HttpClient sends a request to a URL derived from a
      non-literal (config/build-parameter influenced) value while a credentials
      provider (UsernamePasswordCredentials / BasicCredentialsProvider) is
      attached to the request context. If an attacker can influence the URL,
      this becomes SSRF where the request (and the embedded credentials and any
      payload) is delivered to an attacker-controlled host (CWE-918 / CWE-522).
      Validate that the target URL is pinned to a trusted, literal endpoint and
      never attacker-influenceable.
    severity: WARNING
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: new HttpGet($URL)
          - pattern: new HttpPost($URL)
      - pattern-not: new HttpGet("...")
      - pattern-not: new HttpPost("...")
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/918.html
        - www.jenkins.io/doc/developer/security/access-control/sandbox/
      source: semgrep-rule-gap
      license: MIT