rules:
  - id: codevigilant.java.jenkins.log-injection.response.tainted-print
    mode: taint
    pattern-sources:
      - pattern: EntityUtils.toString(...)
    pattern-sinks:
      - pattern: $L.println($V)
      - pattern: $L.print($V)
      - pattern: $L.error($V)
    pattern-sanitizers:
      - pattern: $X.replaceAll(...)
      - pattern: $X.replace(...)
    message: |
      Detected an HTTP response body (EntityUtils.toString) flowing into a
      build-log printing sink (PrintStream.println/print or BuildListener.error)
      without sanitization. Response bodies received by the Jenkins controller
      from remote services are attacker-influenced when the remote endpoint is
      untrusted, compromised, or reachable over plaintext http (MITM). Printed
      verbatim, embedded ANSI/terminal escape sequences are interpreted when
      the log is rendered in a terminal or by log tools, enabling console-log
      forgery (fake build results, hidden output, terminal-emulator escape
      actions). Sanitize the value before printing: strip control characters
      (e.g. [\\x00-\\x1F\\x7F]) or HTML-encode it before it reaches the log sink.
    metadata:
      category: security
      cwe: "CWE-117: Improper Output Neutralization for Logs"
      owasp: "A03:2021 - Injection"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://owasp.org/www-community/attacks/Log_Injection
        - https://www.jenkins.io/doc/developer/security/
      source: independent security review
      license: MIT
    languages: [java]
    severity: HIGH
