rules:
  - id: codevigilant.java.jenkins.credentials.acl-system-fill-credential-lookup
    patterns:
      - pattern-inside: |
          public $RET $HANDLER(...) {
            ...
          }
      - metavariable-regex:
          metavariable: $HANDLER
          regex: ^doFill[A-Z]
      - pattern-either:
          - pattern: CredentialsProvider.lookupCredentials($TYPE, $CTX, ACL.SYSTEM)
          - pattern: CredentialsProvider.lookupCredentials($TYPE, $CTX, ACL.SYSTEM, $EXTRA)
      - pattern-not-inside: |
          public $RET $HANDLER(...) {
            ...
            $X.checkPermission($PERM);
            ...
          }
    message: |
      Detected a Stapler form-filling handler (doFill*) that resolves
      credentials with ACL.SYSTEM instead of the requesting user's
      authentication. The resulting credential list (IDs, usernames, endpoint
      metadata) is returned unfiltered by the caller's permissions, so any
      user who can reach the descriptor URL can enumerate every stored
      credential of this type even without Credentials/View permission
      (CWE-522/CWE-200). Pass the caller's authentication (e.g. the
      ItemGroup/context or Jenkins.getAuthentication2()) into
      lookupCredentials and restrict the results with withMatching(...), and
      guard the handler with an explicit permission check.
    metadata:
      category: security
      cwe: "CWE-522: Insufficiently Protected Credentials"
      owasp: "A01:2021 - Broken Access Control"
      technology: jenkins
      confidence: HIGH
      references:
        - https://www.jenkins.io/doc/developer/security/
        - https://javadoc.jenkins.io/plugin/credentials/com/cloudbees/plugins/credentials/CredentialsProvider.html
      source: independent security review
      license: MIT
    languages: [java]
    mode: search
    severity: HIGH