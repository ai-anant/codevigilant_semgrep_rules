rules:
  - id: codevigilant.java.jenkins.credentials.plaintext-commandline
    mode: taint
    pattern-sources:
      - pattern: $CRED.getPlainText()
      - pattern: $CRED.getPassword()
      - pattern: $CRED.getSecret()
      - pattern: $CRED.getSecretValue()
    pattern-sinks:
      - pattern: Runtime.exec($ARG)
      - pattern: |
          new ProcessBuilder($ARGS)
      - pattern: |
          $CMD.add($ARG)
      - pattern: |
          $CMD.addMasked($ARG)
    message: |
      Detected a credential value (password or secret retrieved from a
      credential store or model object) flowing into a command-line
      argument. Process arguments are visible in the OS process table
      (e.g. /proc/<pid>/cmdline on Linux, Task Manager on Windows) to any
      local user of the node, and may also be captured by build wrappers
      or process monitoring. Log masking alone does not help: the secret
      still travels in the argument vector. Pass secrets to child
      processes via environment variables, stdin, or a
      permission-protected temporary file instead of the argument list.
    metadata:
      category: security
      cwe: "CWE-214: Exposure of Sensitive Information Due to Incompatible Policies"
      owasp: "A01:2021 - Broken Access Control"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://owasp.org/www-community/attacks/Command_Line_Injection
        - https://www.jenkins.io/doc/developer/security/
      source: independent security review
      license: MIT
    languages: [java]
    severity: HIGH
