rules:
  - id: codevigilant.java.jenkins.credentials.plaintext-environment
    mode: taint
    pattern-sources:
      - pattern: $CRED.getPassword()
      - pattern: $CRED.getSecret()
      - pattern: $CRED.getPlainText()
      - pattern: $CRED.getSecretValue()
      - pattern: $CRED.getToken()
      - pattern: $CRED.getApiKey()
    pattern-sinks:
      - patterns:
          - pattern: $VARS.put($NAME, $VALUE)
          - metavariable-regex:
              metavariable: $VARS
              regex: (?i).*(env).*
      - patterns:
          - pattern: $VARS.putAll($MAP)
          - metavariable-regex:
              metavariable: $VARS
              regex: (?i).*(env).*
    message: |
      Detected a credential value (password/secret/token retrieved from a
      credential store or a model object getter) flowing into a child-process
      environment map (EnvVars or similar 'env'-named map). Credentials placed
      into the environment of a launched process are inherited by every child
      process and are visible to other processes running under the same OS user
      on the node (e.g. via 'ps eww' on Linux), and they are captured in
      process dumps and build wrappers. Pass secrets to child processes only
      through Jenkins' secret-handling mechanisms (credentials bindings with
      masking, stdin, or a permission-protected file) and never store them in
      plaintext model fields.
    metadata:
      category: security
      cwe: "CWE-214: Exposure of Sensitive Information Due to Incompatible Policies"
      owasp: "A01:2021 - Broken Access Control"
      technology: jenkins
      confidence: MEDIUM
      references:
        - https://www.jenkins.io/doc/developer/security/
        - https://www.jenkins.io/doc/developer/security/secrets/
      source: independent security review
      license: MIT
    languages: [java]
    severity: HIGH
