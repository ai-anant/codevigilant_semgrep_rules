rules:
  - id: codevigilant.java.jenkins.ssl.accept-all-trustmanager
    patterns:
      - pattern-inside: |
          class $TM implements X509TrustManager {
            ...
          }
      - pattern-either:
          - pattern: |
              public void checkServerTrusted(X509Certificate[] $C, String $A) {
              }
          - pattern: |
              public void checkServerTrusted(X509Certificate[] $C, String $A) throws $E {
              }
    message: |
      Detected an X509TrustManager implementation whose checkServerTrusted
      method has an empty body. Such a trust manager accepts every certificate,
      enabling man-in-the-middle attacks against any TLS connection that uses
      it (credentials transmitted over the connection can be intercepted).
      Use a real KeyStore/TrustManagerFactory-based trust manager instead.
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      technology: jenkins
      confidence: HIGH
      references:
        - https://www.jenkins.io/doc/developer/security/
      source: independent security review
      license: MIT
    languages: [java]
    mode: search
    severity: HIGH
