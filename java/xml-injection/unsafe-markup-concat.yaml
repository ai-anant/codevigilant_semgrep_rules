rules:
  - id: codevigilant.java.xml-injection.markup.unsafe-concat
    patterns:
      - pattern: $A + $X + $B
      - metavariable-regex:
          metavariable: $A
          regex: '^"<.*>"$'
      - metavariable-regex:
          metavariable: $B
          regex: '^"</.*>"$'
      - pattern-not: $P1 + "$LIT" + $P2
      - pattern-not: $P1 + $Y.replace(...) + $P2
      - pattern-not: $P1 + $Y.replaceAll(...) + $P2
      - pattern-not: $P1 + $Y.replaceFirst(...) + $P2
    message: |
      Detected an XML/HTML markup fragment built by string concatenation of a
      non-literal value between markup tags (e.g. "<tag>" + value + "</tag>").
      If the concatenated value is derived from user-controlled or
      build-controlled data (request parameters, SCM commit metadata, build
      display names, configuration values) and is not XML-escaped, the value is
      interpreted as markup by downstream XML consumers (TwiML/voice
      processors, HTML renderers, config parsers), enabling markup/verb
      injection (CWE-74) or stored XSS (CWE-79). Escape the value with an XML
      encoding function before embedding, or build the document with a proper
      XML API (DOM/StAX) that escapes automatically.
    metadata:
      category: security
      cwe: "CWE-74: Improper Neutralization of Special Elements in Output Used by a Downstream Component ('Injection')"
      owasp: "A03:2021 - Injection"
      technology: java
      confidence: MEDIUM
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
        - https://www.jenkins.io/doc/developer/security/
      source: independent security review
      license: MIT
    languages: [java]
    severity: HIGH
